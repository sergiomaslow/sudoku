name: Compilar APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Preparar archivos y Capacitor
      run: |
        mkdir www
        cp index.html www/
        cp sudokuimagen.jpg www/
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Sudoku" "com.sergiomaslow.sudoku" --web-dir=www
        npx cap add android
        npx cap sync android

    - name: Instalar ImageMagick y generar Icono
      run: |
        sudo apt-get update && sudo apt-get install -y imagemagick
        cd android/app/src/main/res
        convert ../../../../../sudokuimagen.jpg -resize 48x48 mipmap-mdpi/ic_launcher.png
        convert ../../../../../sudokuimagen.jpg -resize 72x72 mipmap-hdpi/ic_launcher.png
        convert ../../../../../sudokuimagen.jpg -resize 96x96 mipmap-xhdpi/ic_launcher.png
        convert ../../../../../sudokuimagen.jpg -resize 144x144 mipmap-xxhdpi/ic_launcher.png
        convert ../../../../../sudokuimagen.jpg -resize 192x192 mipmap-xxxhdpi/ic_launcher.png
        
        rm -f mipmap-anydpi-v26/ic_launcher.xml

    - name: Construir APK
      run: |
        cd android
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24' } }" >> app/build.gradle
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: Sudoku-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
